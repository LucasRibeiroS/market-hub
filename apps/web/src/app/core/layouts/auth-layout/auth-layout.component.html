<div class="auth-layout">
    <div class="auth-wrapper">

        <div class="auth-brand">
            <img src="/logo.svg" alt="Logo" class="auth-logo" onerror="this.style.display='none'" />
        </div>

        <div class="auth-card">
            <div class="auth-card-header">
                <h1 class="auth-title">{{ title() }}</h1>
            </div>
            <div class="auth-card-body">
                <router-outlet />
            </div>
        </div>

        <p class="auth-footer-text">Integrator &copy; {{ year }}</p>
    </div>
</div>
