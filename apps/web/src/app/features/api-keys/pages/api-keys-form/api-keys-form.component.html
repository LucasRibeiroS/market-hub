<!-- Header -->
<app-page-header
    [title]="isEdit ? 'Editar chave' : 'Nova chave'"
    description="{{ isEdit
        ? 'Atualize as informações da sua chave de API.'
        : 'Crie uma nova chave de acesso à API da plataforma.' }}
    "
    [showBackButton]="true"
    (backClick)="goBack()"
/>

<!-- Form card -->
<form [formGroup]="form" (ngSubmit)="onSubmit()">
    <app-form-card [isLoading]="isLoading()">
        <ng-container formCardHeader>
            @if (isEdit && existingKey()) {
                <div class="card-header-info">
                    <span class="card-header-label">Chave</span>
                    <app-code>{{ existingKey()!.key_preview }}</app-code>
                </div>
            } @else {
                <span class="card-header-label">Sua nova chave será exibida após a criação</span>
            }
        </ng-container>

        <div class="form-content">
            <app-input-text
                id="name"
                label="Nome"
                placeholder="ex: Produção"
                [control]="$any(form.get('name'))"
            />

            <app-dropdown
                label="Permissões"
                placeholder="Selecione as permissões para esta chave"
                [options]="permissions()"
                [control]="$any(form.get('permissions'))"
                [multiple]="true"
            />

            <app-checkbox
                label="Chave ativa?"
                description="Desativar bloqueará todas as requisições que usam esta chave."
                [control]="$any(form.get('is_active'))"
            />
        </div>

        <ng-container formCardFooter>
            <app-button
                label="Cancelar"
                severity="secondary"
                [text]="true"
                (click)="goBack()"
            />
            <app-button
                [label]="isEdit ? 'Salvar alterações' : 'Criar chave'"
                [isLoading]="isSaving()"
                [disabled]="form.invalid || isSaving()"
                (click)="onSubmit()"
            />
        </ng-container>
    </app-form-card>
</form>

<app-api-key-created-modal
    [visible]="newKeyValue() !== null"
    [apiKey]="newKeyValue()"
    (dismiss)="onCreatedModalDismiss()"
/>
