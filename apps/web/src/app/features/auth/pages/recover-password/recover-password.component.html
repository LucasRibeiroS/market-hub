<form [formGroup]="recoverForm" (ngSubmit)="onSubmit()">
    @if (currentStep() === 'code') {
        <app-input-text
            label="E-mail"
            placeholder="Seu endereço de e-mail"
            type="email"
            [control]="$any(recoverForm.get('email'))"
        />
    }

    @if (currentStep() === 'reset') {
        <app-input-text
            label="Código de verificação"
            placeholder="Digite o código de 6 dígitos"
            type="otp"
            [maxLength]="6"
            [control]="$any(recoverForm.get('code'))"
        />
        <div class="resend-code">
            Não recebeu o código?
            <app-button-text label="Reenviar" (click)="resendCode()" />
        </div>

        <app-input-text
            label="Nova senha"
            placeholder="Digite sua nova senha"
            type="password"
            [control]="$any(recoverForm.get('password'))"
        />
    }

    <app-button
        [label]="currentStep() === 'reset' ? 'Redefinir senha' : 'Enviar código'"
        [isLoading]="isLoading()"
        type="submit"
    />

    <hr />

    <p class="toggle-text">
        Lembrou sua senha?
        <a routerLink="/auth/sign-in">Voltar para login</a>
    </p>
</form>
