<app-page-header
    title="Minha conta"
    description="Gerencie as informações do seu perfil e preferências da conta."
/>

@if (currentUser$ | async; as user) {
    <div class="account-card">
        <div class="account-avatar">
            <span class="avatar-initials">{{ user.name[0] }}</span>
        </div>
        <div class="account-info">
            <span class="account-name">{{ user.name }}</span>
            <span class="account-email">{{ user.email }}</span>
        </div>
    </div>

    <div class="danger-section">
        <h2 class="danger-title">Zona de perigo</h2>
        <p class="danger-description">Ao sair, sua sessão será encerrada neste dispositivo.</p>
        <app-button
            label="Sair da conta"
            severity="danger"
            [outlined]="true"
            [fluid]="false"
            icon="pi pi-sign-out"
            (onClick)="onLogout()"
        />
    </div>
}
