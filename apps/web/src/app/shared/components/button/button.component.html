<p-button
    [label]="label"
    [pTooltip]="tooltip"
    tooltipPosition="top"
    positionTop="-7"
    [type]="type"
    [fluid]="fluid"
    [loading]="isLoading"
    [disabled]="disabled"
    [severity]="severity"
    [text]="text"
    [outlined]="outlined"
    [icon]="icon"
    [iconPos]="iconPos"
    [size]="size"
    (onClick)="handleClick($event)">
</p-button>
