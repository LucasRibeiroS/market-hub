<p-dialog
    [visible]="visible()"
    (visibleChange)="visible.set($event)"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    [closable]="closable()"
    [style]="{ width: width() }"
    [header]="header()"
>
    <div class="modal-body">
        <ng-content select="[modalBody]" />
    </div>

    <ng-template pTemplate="footer">
        <div class="modal-footer">
            <ng-content select="[modalFooter]" />
        </div>
    </ng-template>
</p-dialog>
