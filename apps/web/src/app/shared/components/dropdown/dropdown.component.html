<div class="field">
    @if (label()) {
        <label [for]="id()" class="field-label">{{ label() }}</label>
    }

    @if (!multiple()) {
        <p-select
            [inputId]="id()"
            [options]="options()"
            [optionLabel]="optionLabel()"
            [optionValue]="optionValue()"
            [placeholder]="placeholder()"
            [filter]="filter()"
            [showClear]="showClear()"
            [loading]="loading()"
            [formControl]="$any(control())"
            styleClass="field-select"
        />
    }

    @if (multiple()) {
        <p-multiselect
            [inputId]="id()"
            [options]="options()"
            [optionLabel]="optionLabel()"
            [optionValue]="optionValue()"
            [placeholder]="placeholder()"
            [filter]="filter()"
            [showClear]="showClear()"
            [showHeader]="false"
            [loading]="loading()"
            [formControl]="$any(control())"
            styleClass="field-multiselect"
            display="chip"
        />
    }

    <div class="dropdown-footer">
        @if (showError) {
            <span class="field-error">{{ errorMessage }}</span>
        } @else {
            <span></span>  <!-- spacer to keep the link right-aligned -->
        }
        <ng-content select="[dropdownSuffix]" />
    </div>
</div>
