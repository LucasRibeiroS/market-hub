services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-integrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-integrator}
      POSTGRES_DB: ${POSTGRES_DB:-integrator}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-integrator}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - apps/api/.env.docker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-integrator}:${POSTGRES_PASSWORD:-integrator}@postgres:5432/${POSTGRES_DB:-integrator}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - '${API_PORT:-3333}:3000'
      - '${API_QUEUE_MONITORING_PORT:-13000}:13000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
